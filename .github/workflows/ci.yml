name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Linux (Swift 6.4)
    runs-on: ubuntu-latest
    # Match platform and MicroSQL: setup-swift cannot install 6.4 yet.
    # Restore hosted macOS coverage when that toolchain is available.
    container: wearecococo/swift:6.4
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
